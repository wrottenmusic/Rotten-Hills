<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotten Hills | Official Promo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #050505; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px 140px 20px; }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #5e00ff, #ff0077, #00d4ff);
            filter: blur(120px); opacity: 0.3; z-index: -1;
            animation: moveBackground 12s infinite alternate ease-in-out;
        }
        @keyframes moveBackground { from { transform: scale(1); } to { transform: scale(1.2); } }

        .player-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(45px) saturate(210%);
            -webkit-backdrop-filter: blur(45px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px; padding: 30px; width: 100%; max-width: 440px;
            text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.7);
            margin-bottom: 30px;
        }

        .cover-art { width: 100%; aspect-ratio: 1/1; border-radius: 22px; object-fit: cover; margin-bottom: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 5px; }
        .artist { color: rgba(255, 255, 255, 0.55); font-size: 14px; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .stream-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 18px; overflow: hidden; margin-bottom: 15px; background: #000; border: 1px solid rgba(255,255,255,0.1); }
        .stream-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .btn-subscribe { display: block; background: #ff0000; color: white; padding: 12px; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 700; margin-bottom: 25px; transition: 0.3s; }
        .btn-subscribe:hover { opacity: 0.8; transform: scale(1.02); }

        .stream-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-stream { 
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 15px; color: white; text-decoration: none; font-size: 12px; font-weight: 700; transition: 0.3s;
        }
        .btn-stream:hover { background: rgba(255,255,255,0.2); }

        /* The Always-Visible Download Button */
        .btn-download { display: block; background: #fff; color: #000; padding: 18px; border-radius: 18px; font-weight: 800; text-decoration: none; font-size: 16px; box-shadow: 0 10px 25px rgba(255,255,255,0.1); transition: 0.3s; }
        .btn-download:hover { transform: scale(1.03); background: #f0f0f0; }

        .social-footer {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            padding: 12px 25px; border-radius: 50px; display: flex; gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 100;
        }
        .social-icon { color: white; text-decoration: none; font-size: 14px; font-weight: 700; opacity: 0.7; transition: 0.3s; }
        .social-icon:hover { opacity: 1; transform: translateY(-3px); }

        .label-footer {
            margin-top: 35px; padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 10px; color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase; letter-spacing: 2px; line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="player-card">
        <img src="cover.png" alt="Rotten Hills Cover" class="cover-art">
        <h1>Rotten Hills</h1>
        <p class="artist">Victor Wrott x Anon Hills</p>

        <div class="stream-box">
            <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=PLEdH6D8o4-RtUMfNwL9fNI2k24-o0SVwQ&index=1&shuffle=1" frameborder="0" allowfullscreen></iframe>
        </div>
        
        <a href="https://youtube.com/@victorwrott" target="_blank" class="btn-subscribe">SUBSCRIBE ON YOUTUBE</a>

        <div class="stream-links">
            <a href="https://www.boomplay.com/albums/127056912" target="_blank" class="btn-stream">BOOMPLAY</a>
            <a href="https://audiomack.com/victorwrott/album/rotten-hiils" target="_blank" class="btn-stream">AUDIOMACK</a>
        </div>

        <div id="download-section">
            <a href="https://www.mediafire.com/file/f4m3g7d91bzsap4/Rotten_Hills_-_victor_wrott_%2526_Anon_Hills_%25283%2529.zip/file" class="btn-download" target="_blank">DOWNLOAD FULL EP</a>
        </div>

        <div class="label-footer">
            <p>© 2026 Euphonic Sounds</p>
            <p>Recorded & Mixed at Euphonic Studios</p>
        </div>
    </div>

    <div class="social-footer">
        <a href="https://twitter.com/victorwrott" target="_blank" class="social-icon">Twitter</a>
        <a href="https://youtube.com/victorwrott" target="_blank" class="social-icon">YT</a>
        <a href="https://facebook.com/wrottmusic" target="_blank" class="social-icon">FB</a>
        <a href="https://instagram.com/victorwrott" target="_blank" class="social-icon">IG</a>
        <a href="https://snapchat.com/add/victorwrott" target="_blank" class="social-icon">Snap</a>
    </div>

</body>
</html>
